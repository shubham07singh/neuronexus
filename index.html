<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Landing Page</title>
    <link rel="stylesheet" href="index.css">
  </head>
 
<body>
  <div class="form-container">
    <h2>Information Form</h2>
    <form>
        <label for="fullname">Full Name <span class="required">*</span></label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your Name" required>

      <label for="contact">Contact Number <span class="required">*</span></label>
      <input type="tel" id="contact" name="contact" placeholder="Enter your Contact number" required>

      <label for="address">Address</label>
      <textarea id="address" name="address" placeholder="Enter your address with pincode" required></textarea>

      <label for="company">Company Name</label>
      <input type="text" id="company" name="company" placeholder="If fresher, enter NA" required>

      <label for="email">Email Address <span class="required">*</span></label>
      <input type="email" id="email" name="email" placeholder="Enter your mail id" required>


      <label for="department">Department <span class="required">*</span></label>
      <select id="department" name="department" required>
        <option value="">--Select--</option>
        <option value="HR">HR</option>
        <option value="Sales">Sales</option>
        <option value="Development">Development</option>
        <option value="Marketing">Marketing</option>
        <option value="Others">Others</option>
      </select>

      <label>Gender <span class="required">*</span></label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
      </div>

      <input type="submit" value="Submit">
    </form>
  </div>
</body>
</html>
